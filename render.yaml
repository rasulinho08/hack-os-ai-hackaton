# Render Blueprint — one-click deploy of the HackOS API.
#
#   Render dashboard → New → Blueprint → pick this repository.
#
# DATABASE_URL is deliberately NOT defined here: create the Postgres database
# separately (production runs on Supabase — use its session-pooler URI; Render's
# own free database expires) and paste the connection string into the
# dashboard when Render asks. A staging copy is described in docs/STAGING.md.
# JWT_SECRET is generated by Render and stored encrypted; it never lands in git.
services:
  - type: web
    name: hackos-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt          # closest Render region to Azerbaijan
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true    # Render generates a strong secret once
      - key: DATABASE_URL
        sync: false            # paste the Supabase session-pooler URI in the dashboard
      - key: FRONTEND_URL
        sync: false            # e.g. https://hack-os.app
      - key: FRONTEND_URLS
        sync: false            # e.g. https://hack-os.app,https://www.hack-os.app
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      # The web app lives on www.hack-os.app and app.hack-os.app and must share
      # one session: without this the cookie is host-only and a customer who
      # signs in on one host is asked to sign in again on the other.
      - key: COOKIE_DOMAIN
        sync: false            # e.g. .hack-os.app
      # Hop count (or list) the API trusts for the client IP. The failed-login
      # limiter is keyed on it: too few hops and every user shares the proxy's
      # bucket (100 failed attempts lock everyone out for 15 min); too many and
      # a client can spoof X-Forwarded-For. Verify by logging req.ip once.
      - key: TRUST_PROXY
        sync: false            # e.g. 1 (default) — see docs in .env.example
      # E-mail. An HTTPS API, because the free plan blocks outbound SMTP.
      # See docs/EMAIL.md; Settings → E-mail delivery sends a test.
      - key: RESEND_API_KEY
        sync: false            # from resend.com → API Keys
      - key: MAIL_FROM_EMAIL
        sync: false            # e.g. no-reply@hack-os.app (domain verified in Resend)
      - key: MAIL_FROM_NAME
        value: HackOS
      - key: SALES_NOTIFY_EMAIL
        sync: false            # inbox for new orders and contact-form messages
      - key: APP_ORIGIN
        sync: false            # https://app.hack-os.app — setup links lead there
      # Invoices: the seller printed on every PDF (docs/COMMERCE.md). Leave the
      # bank details empty until there is an account; the invoice says so.
      - key: INVOICE_SELLER_NAME
        value: HackOS
      - key: INVOICE_SELLER_ADDRESS
        sync: false
      - key: INVOICE_SELLER_TAX_ID
        sync: false
      - key: INVOICE_BANK_NAME
        sync: false
      - key: INVOICE_BANK_IBAN
        sync: false
      # Platform owner: who may be superadmin, and the second-step code.
      - key: SUPERADMIN_EMAILS
        sync: false            # your address only
      - key: SUPERADMIN_PIN
        sync: false            # 6 digits you choose; asked after the password
